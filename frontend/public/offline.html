<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1F6B43" />
    <title>Farm Connect — Offline</title>
    <style>
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: #F8F4E8;
        color: #123524;
        font-family: system-ui, sans-serif;
      }
      main {
        width: min(32rem, calc(100% - 2rem));
        border-radius: 2rem;
        background: white;
        padding: 2rem;
        text-align: center;
        box-shadow: 0 12px 32px rgb(18 53 36 / 0.13);
      }
      h1 {
        font-family: Georgia, serif;
      }
      button {
        border: 0;
        border-radius: 0.75rem;
        background: #1F6B43;
        color: white;
        cursor: pointer;
        padding: 0.8rem 1.2rem;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>Previously visited Farm Connect pages may still be available. Reconnect to load marketplace data or send messages.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
